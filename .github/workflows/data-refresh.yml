# 데이터 자동 갱신(2026-11-27). 매주 월·목 새벽에 전월세 실거래·공영주차장 자료를 받아
# 이상치 검사 → 테스트·빌드 → main에 커밋(→ Cloudflare Pages 자동 배포). 실패하면 이슈를 열어 메일로 알린다.
# 준비: 저장소 Settings → Secrets and variables → Actions 에 DATA_GO_KR_KEY(공공데이터포털 일반 인증키) 한 번 등록.
# 수동 실행: Actions 탭 → '데이터 자동 갱신' → Run workflow.
# 건물 좌표: 주소정보 DB가 없으므로 지난번 rent-buildings 파일의 좌표를 이어받는다(새 건물만 좌표 없음 → 가끔 PC에서 채움).
name: 데이터 자동 갱신
on:
  schedule:
    - cron: '17 19 * * 0,3' # 매주 월·목 04:17(한국 시각). 실거래 신고 기한 30일 → 최근 3개월을 매번 새로 받는다(캐시가 7일 안 쓰면 지워져 주 2회)
  workflow_dispatch:
    inputs:
      only:
        description: 무엇을 갱신할까요
        type: choice
        options: [전체, 전월세, 주차장]
        default: 전체
permissions:
  contents: write
  issues: write
concurrency:
  group: data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # 받기는 200분에서 스스로 멈추고 캐시를 저장한다(첫 실행이 길어도 다음 실행이 이어 받음)
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      ONLY: ${{ inputs.only || '전체' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: 인증키 확인
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then
            echo "::error::저장소 Secrets에 DATA_GO_KR_KEY가 없어요"; exit 1
          fi

      - name: 정부 API 접속 확인
        run: |
          code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' "https://apis.data.go.kr/1613000/RTMSDataSvcOffiRent/getRTMSDataSvcOffiRent" || true)
          echo "apis.data.go.kr → HTTP $code"
          if [ "$code" = "000" ]; then echo "::error::GitHub 서버(해외)에서 정부 API 접속이 막혔어요"; exit 1; fi

      - run: npm ci

      # 지난번에 받은 월별 원본(층·계약일 뺀 필드만)을 이어 써서, 매주 최근 3개월만 새로 부른다
      - name: 전월세 캐시 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .cache/rent
          key: rent-raw-${{ github.run_id }}
          restore-keys: rent-raw-

      - name: 공영주차장 받기
        id: parking
        if: env.ONLY != '전월세'
        continue-on-error: true
        run: npm run fetch-parking

      - name: 전월세 실거래 받기
        id: rent
        if: env.ONLY != '주차장'
        continue-on-error: true
        run: npm run fetch-rent -- --fresh 3 --apt-auto --delay 150 --max-minutes 200

      - name: 전월세 캐시 저장
        if: always() && hashFiles('.cache/rent/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/rent
          key: rent-raw-${{ github.run_id }}

      - name: 이상치 검사
        id: check
        run: |
          npm run -s check-data -- --out check.md
          cat check.md >> "$GITHUB_STEP_SUMMARY"

      - name: 테스트·빌드
        id: build
        run: |
          npm test
          npm run build

      - name: 커밋하고 올리기(→ 자동 배포)
        id: push
        run: |
          git config user.name "dongnekokkok-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/parking.json src/data/parking.report.json src/data/rent-stats.json src/data/rent.report.json src/data/rent-buildings
          if git diff --cached --quiet; then echo "바뀐 데이터가 없어요"; exit 0; fi
          git commit -q -m "데이터 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 15))
          done
          echo "::error::main에 올리지 못했어요"; exit 1

      - name: 받기 단계 결과 확인
        if: steps.parking.outcome == 'failure' || steps.rent.outcome == 'failure'
        run: |
          echo "::error::주차장=${{ steps.parking.outcome }} 전월세=${{ steps.rent.outcome }} (성공한 쪽만 배포했어요)"; exit 1

      - name: 실패 알림(이슈)
        if: failure() || cancelled()
        uses: actions/github-script@v7
        env:
          PARKING: ${{ steps.parking.outcome }}
          RENT: ${{ steps.rent.outcome }}
          CHECK: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul' });
            const check = fs.existsSync('check.md') ? fs.readFileSync('check.md', 'utf8') : '';
            const body = [
              `**${date} 데이터 자동 갱신이 실패했어요.** 사이트는 지난번 데이터 그대로예요.`, '',
              `- 공영주차장: ${process.env.PARKING || '건너뜀'} · 전월세: ${process.env.RENT || '건너뜀'} · 이상치 검사: ${process.env.CHECK || '실행 안 됨'}`,
              `- 실행 기록: ${run}`, '', check, '',
              'Claude에게 "데이터 갱신 실패 이슈 봐 줘"라고 하면 원인을 확인할게요. 다음 월·목 새벽에 자동으로 다시 시도해요.',
            ].join('\n');
            const title = '데이터 자동 갱신 실패';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 50 });
            const prev = open.find((i) => i.title.startsWith(title));
            if (prev) await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body });
            else await github.rest.issues.create({ ...context.repo, title: `${title} (${date})`, body, assignees: [context.repo.owner] });

      - name: 성공하면 열린 실패 이슈 닫기
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 50 });
            for (const i of open.filter((i) => i.title.startsWith('데이터 자동 갱신 실패'))) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: '다음 자동 갱신이 성공해서 닫아요.' });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
            }
